<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Study Abroad Equivalency Review</title>
<meta name="description" content="Approve or disapprove the closest U-M course for each study-abroad course.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
:root {
  --bg: #f5f3ee; --surface: #fffefb; --surface-2: #eeebe4; --surface-3: #e3dfd5;
  --ink: #192024; --ink-2: #434f55; --ink-3: #6c777d; --line: #dfd9ce; --line-2: #c8c1b3;
  --accent: #0c5c63; --accent-ink: #ffffff; --accent-soft: #dbebe9;
  --ok: #23714a; --ok-hover: #1b5c3b; --ok-ink: #ffffff; --ok-soft: #dcefe2;
  --no: #a5392c; --no-soft: #f6ddd8;
  --dept: #24617f; --dept-soft: #dce8f0; --gen: #596067; --gen-soft: #e6e5e1;
  --warn: #8f5d0e; --warn-soft: #f5e6c8;
  --mark: #f6e1a0; --mark-ink: #192024; --meter-off: #d8d8d1; --scrim: rgba(18, 24, 27, .42);
  --shadow: 0 1px 2px rgba(25, 32, 36, .06), 0 10px 30px rgba(25, 32, 36, .12);
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --top-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1417; --surface: #161c20; --surface-2: #1d252a; --surface-3: #263138;
    --ink: #e9e5db; --ink-2: #bbb6aa; --ink-3: #8d897f; --line: #29343a; --line-2: #37444c;
    --accent: #6bbcbc; --accent-ink: #0a1416; --accent-soft: #173538;
    --ok: #5fbf8a; --ok-hover: #7ccd9f; --ok-ink: #0b1a12; --ok-soft: #15301f;
    --no: #ef8a7a; --no-soft: #3b1f1a;
    --dept: #88bbd9; --dept-soft: #172a36; --gen: #a8acb0; --gen-soft: #252b2f;
    --warn: #e3ab59; --warn-soft: #382a12;
    --mark: #5a4912; --mark-ink: #f7eed2; --meter-off: #2c373d; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 32px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1417; --surface: #161c20; --surface-2: #1d252a; --surface-3: #263138;
  --ink: #e9e5db; --ink-2: #bbb6aa; --ink-3: #8d897f; --line: #29343a; --line-2: #37444c;
  --accent: #6bbcbc; --accent-ink: #0a1416; --accent-soft: #173538;
  --ok: #5fbf8a; --ok-hover: #7ccd9f; --ok-ink: #0b1a12; --ok-soft: #15301f;
  --no: #ef8a7a; --no-soft: #3b1f1a;
  --dept: #88bbd9; --dept-soft: #172a36; --gen: #a8acb0; --gen-soft: #252b2f;
  --warn: #e3ab59; --warn-soft: #382a12;
  --mark: #5a4912; --mark-ink: #f7eed2; --meter-off: #2c373d; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 32px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#app { max-width: 1320px; margin: 0 auto; padding-inline: 24px; }

/* header */
.top { display: flex; align-items: center; gap: 12px; padding-block: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.brand { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
.mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 600 19px/1 var(--serif); flex: none; }
.bname { font: 600 17px/1 var(--serif); letter-spacing: -.005em; }
.subj { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 12px; font: 500 13px/1.4 var(--mono); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.subj:hover { border-color: var(--ink-3); }
.nav { display: flex; align-items: center; gap: 4px; }
.pos { font-size: 14px; color: var(--ink-2); white-space: nowrap; min-width: 7.5em; text-align: center; }
.pos b { color: var(--ink); font-weight: 600; }
.ib { border: 1px solid transparent; background: transparent; border-radius: 8px; height: 34px; min-width: 34px; padding: 0 9px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink-2); white-space: nowrap; }
.ib:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
.ib:disabled { opacity: .35; }
.ib.framed { border-color: var(--line-2); background: var(--surface); }
.progsel { max-width: 300px; }
.donect { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.filtered { border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 999px; font-size: 12px; font-weight: 600; padding: 2px 9px; }
.grow { flex: 1; }
select { background: var(--surface); border: 1px solid var(--line-2); border-radius: 9px; padding: 7px 10px; min-width: 0; color: var(--ink); }
select:hover { border-color: var(--ink-3); }

/* decision */
.decide-wrap { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h)); z-index: 25; background: var(--bg); padding-bottom: 2px; }
.decide { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(0, 0, 0, .04); padding: 12px 14px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.approve, .reject { border-radius: 10px; padding: 0 18px; height: 42px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.approve { background: var(--ok); color: var(--ok-ink); border: 1px solid var(--ok); }
.approve:hover:not(:disabled) { background: var(--ok-hover); border-color: var(--ok-hover); }
.reject { background: transparent; color: var(--no); border: 1.5px solid var(--no); }
.reject:hover:not(:disabled) { background: var(--no-soft); }
.approve:disabled, .reject:disabled { opacity: .4; }
.sels { display: contents; }
.fld { display: flex; align-items: center; gap: 8px; min-width: 0; }
.fld > span { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
.fld select { height: 42px; }
.eqsel { width: min(420px, 100%); }
.crsel { width: 16em; }
.lnk { border: 0; background: none; color: var(--accent); padding: 0; font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.lnk:disabled { color: var(--ink-3); text-decoration: none; }
.notebox { margin-top: 10px; }
.notebox textarea { width: 100%; min-height: 58px; resize: vertical; border: 1px solid var(--line-2); border-radius: 9px; padding: 8px 10px; background: var(--surface); font-size: 14px; }
.verdict { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.v-ok { background: var(--ok-soft); color: var(--ok); } .v-dept { background: var(--dept-soft); color: var(--dept); } .v-gen { background: var(--gen-soft); color: var(--gen); }
.v-no { background: var(--no-soft); color: var(--no); } .v-warn { background: var(--warn-soft); color: var(--warn); }
.vtext { font-size: 15px; min-width: 0; }
.vtext b { font-family: var(--mono); font-weight: 500; }
.who { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; height: 36px; padding: 0 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
a.btn { text-decoration: none; color: var(--ink); }
.dnote { margin-top: 8px; font-size: 14px; color: var(--ink-2); white-space: pre-wrap; }
.alt { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 4px 0; font-size: 14px; }
.alt .msg { color: var(--ink-2); }
.alt .msg b { font-family: var(--mono); font-weight: 500; }
.alt .lab { color: var(--ink-3); font-size: 13px; }
.chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; white-space: nowrap; }
.chip:hover:not(:disabled) { border-color: var(--ink-3); }
.chip.ro { cursor: default; }
.sep { color: var(--line-2); }

/* the pair */
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding-block: 20px 72px; }
.side { min-width: 0; padding-right: 30px; }
.side.um { padding-right: 0; padding-left: 30px; border-left: 1px solid var(--line); }
.kick { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; display: flex; gap: 6px 10px; align-items: baseline; flex-wrap: wrap; min-height: 18px; }
.kick .rk { color: var(--accent); }
.kick .rj { color: var(--no); }
.kick .grow { min-width: 8px; }
.ctitle { font: 500 28px/1.16 var(--serif); letter-spacing: -.012em; margin: 6px 0 6px; text-wrap: balance; overflow-wrap: anywhere; }
.csub { color: var(--ink-2); font-size: 14px; display: flex; flex-wrap: wrap; gap: 2px 8px; }
.csub .mono { color: var(--ink); }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.fact { background: var(--surface-2); border-radius: 6px; padding: 2px 9px; font-size: 13px; color: var(--ink-2); }
.fact.warn { background: var(--warn-soft); color: var(--warn); }
.fact.bad { background: var(--no-soft); color: var(--no); }
.strength { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13.5px; color: var(--ink-2); flex-wrap: wrap; }
.meter { display: inline-grid; grid-template-columns: repeat(5, 7px); gap: 2px; vertical-align: middle; flex: none; }
.meter i { height: 10px; border-radius: 2px; background: var(--meter-off); }
.meter i.on { background: var(--accent); }
.meter.weak i.on { background: var(--ink-3); }
.desc { font: 400 16.5px/1.62 var(--serif); white-space: pre-wrap; overflow-wrap: anywhere; max-width: 68ch; margin-top: 18px; color: var(--ink); }
.desc.clamp { max-height: 17em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 72%, transparent); mask-image: linear-gradient(#000 72%, transparent); }
.desc.none { font: italic 15px/1.5 var(--serif); color: var(--ink-3); }
.more { margin-top: 6px; }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }
.links { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 13.5px; margin-top: 14px; }
.links a { display: inline-flex; align-items: center; gap: 5px; }
.links svg.i { width: 13px; height: 13px; }
.req { font-size: 13.5px; color: var(--ink-2); margin-top: 12px; max-width: 68ch; }
details.more-info { margin-top: 18px; border-top: 1px solid var(--line); }
details.more-info > summary { list-style: none; cursor: pointer; padding: 10px 0 2px; font-size: 13.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
details.more-info > summary::-webkit-details-marker { display: none; }
details.more-info > summary::before { content: ""; width: 7px; height: 7px; border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: rotate(-45deg); margin: 0 3px 0 1px; transition: transform .15s; }
details.more-info[open] > summary::before { transform: rotate(45deg); }
details.more-info > summary:hover { color: var(--ink); }
.dbody { padding: 10px 0 4px; font-size: 14px; display: grid; gap: 10px; }
.kv { display: grid; grid-template-columns: minmax(96px, 150px) minmax(0, 1fr); gap: 6px 14px; margin: 0; }
.kv dt { color: var(--ink-3); font-size: 13px; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.why { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; font-size: 13.5px; max-width: 520px; }
.why .v { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.why .tot { border-top: 1px solid var(--line); padding-top: 4px; font-weight: 600; }
.small { font-size: 13px; color: var(--ink-3); }
.sims { display: grid; gap: 2px; }
.simrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 7px 8px; border-radius: 8px; border: 0; background: none; text-align: left; width: 100%; }
.simrow:hover { background: var(--surface-2); }
.simrow .t { font: 500 14.5px/1.3 var(--serif); }
.simrow .m { font-size: 12.5px; color: var(--ink-3); grid-column: 1 / -1; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; flex: none; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.dept { background: var(--dept-soft); color: var(--dept); } .pill.gen { background: var(--gen-soft); color: var(--gen); }
.pill.no { background: var(--no-soft); color: var(--no); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.pend { background: var(--surface-2); color: var(--ink-3); }

/* top ten */
.tops { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 2px; }
.trow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 9px 10px; border-radius: 10px; border: 1px solid transparent; background: none; width: 100%; text-align: left; }
.trow:hover { background: var(--surface-2); }
.trow.cur { border-color: var(--accent); background: var(--accent-soft); }
.trow .n { font: 500 13px var(--mono); color: var(--ink-3); }
.trow .c { font: 500 13.5px var(--mono); }
.trow .t { font: 500 15px/1.3 var(--serif); }
.trow .s { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-3); }
.trow.rej .c, .trow.rej .t { text-decoration: line-through; text-decoration-color: var(--no); color: var(--ink-3); }
.trow .m { grid-column: 2 / -1; font-size: 12.5px; color: var(--ink-3); }

.empty { padding: 28px 0; color: var(--ink-2); }
.empty h3 { font: 500 20px var(--serif); margin: 0 0 6px; color: var(--ink); }

/* loading */
.loading { min-height: 70vh; display: grid; place-items: center; text-align: center; }
.loading h1 { font: 500 30px var(--serif); margin: 0 0 8px; }
.progress { width: 260px; max-width: 70vw; height: 4px; background: var(--surface-3); border-radius: 2px; overflow: hidden; margin: 16px auto 8px; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

/* overlays */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--bg); z-index: 51; box-shadow: var(--shadow); display: flex; flex-direction: column; padding: calc(14px + env(safe-area-inset-top, 0px)) 18px calc(10px + env(safe-area-inset-bottom, 0px)); gap: 10px; }
.dhead { display: flex; gap: 8px; align-items: center; }
.search { position: relative; flex: 1; min-width: 0; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.search input { width: 100%; height: 40px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); padding: 0 12px 0 34px; }
.dfilters { display: grid; gap: 8px; }
.frow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.frow select { flex: 1 1 0; width: 0; min-width: 0; }
.frow > .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; width: 4.6em; flex: none; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 7px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.seg .ct { color: var(--ink-3); margin-left: 4px; font-variant-numeric: tabular-nums; }
.dcount { font-size: 13px; color: var(--ink-3); display: flex; gap: 10px; align-items: baseline; }
.vlist { flex: 1; min-height: 0; overflow: auto; position: relative; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.vinner { position: relative; }
.lrow { position: absolute; left: 0; right: 0; height: 64px; padding: 9px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; cursor: pointer; overflow: hidden; }
.lrow:hover { background: var(--surface-2); }
.lrow.cur { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.lrow .l1 { display: flex; gap: 8px; align-items: center; min-width: 0; }
.lrow .lt { font: 500 15px/1.3 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.lrow .l2 { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .l2 b { font: 500 12px var(--mono); color: var(--ink-2); }
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; }
.sheet-wrap .scrim { position: absolute; z-index: 0; }
.sheet { position: relative; z-index: 1; background: var(--bg); border-radius: 16px; box-shadow: var(--shadow); width: min(760px, 100%); max-height: calc(100% - 8px); display: flex; flex-direction: column; min-height: 0; }
.sheet.wide { width: min(1120px, 100%); }
.shead { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.shead h2 { font: 600 19px var(--serif); margin: 0; flex: 1; min-width: 0; }
.sbody { overflow: auto; padding: 18px; min-height: 0; }
.prose { font: 400 16px/1.6 var(--serif); max-width: 72ch; display: grid; gap: 14px; }
.prose h3 { font: 600 13px/1.3 var(--sans); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin: 8px 0 -8px; }
.prose p { margin: 0; }
.prose code, .formula { font: 13.5px/1.5 var(--mono); }
.formula { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; font-family: var(--sans); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font: 600 22px/1.2 var(--serif); }
.stat span { display: block; font-size: 12.5px; line-height: 1.35; color: var(--ink-3); margin-top: 2px; }
.tablewrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { position: sticky; top: 0; background: var(--surface-2); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.tt { font: 500 14.5px/1.3 var(--serif); }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar input { height: 36px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface); padding: 0 10px; }
.plist { display: grid; gap: 2px; margin-top: 12px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 10px; border-radius: 9px; border: 0; background: none; text-align: left; width: 100%; }
.prow:hover { background: var(--surface-2); }
.prow .c { font: 500 13.5px var(--mono); }
.prow .t { font: 500 15px/1.3 var(--serif); }

<script>
'use strict';
/* Equivalency Review. All suggestions are precomputed (cgis_courses/nlp.py) and shipped as data:
   data/<name>.json when served; in the offline copy (one file) as gzip + base64 blocks after the page,
   <script type="application/gzip" data-name="<name>">, unpacked on demand. */
const LOCAL = location.protocol === 'file:';
const TERM = { FA: 'Fall', WN: 'Winter', 'FA;WN': 'Fall or Winter', AY: 'Academic year', SPSU: 'Spring/Summer', outside: 'Not a CGIS term', '': 'Term not published' };
const ACCESS = { open: 'Open to visiting students', restricted: 'Restricted for visiting students', closed: 'Closed to visiting students', unknown: 'Visiting-student access not stated' };
const LANG = { en: 'English', es: 'Spanish', de: 'German', sv: 'Swedish', ja: 'Japanese', fr: 'French', it: 'Italian', nl: 'Dutch', pt: 'Portuguese', da: 'Danish',
  ca: 'Catalan', cs: 'Czech', 'zh-cn': 'Chinese', 'zh-tw': 'Chinese', ko: 'Korean', no: 'Norwegian', fi: 'Finnish', pl: 'Polish', ru: 'Russian', ro: 'Romanian',
  tr: 'Turkish', id: 'Indonesian', cy: 'Welsh', hu: 'Hungarian', el: 'Greek', ar: 'Arabic', vi: 'Vietnamese' };
const OUT = {
  equivalent: { label: 'Approved', cls: 'ok' },
  dept: { label: 'Elective credit', cls: 'dept' },
  general: { label: 'General credit only', cls: 'gen' },
  no: { label: 'Not approved', cls: 'no' },
  info: { label: 'Needs information', cls: 'warn' },
};
const ORD = ['', 'Closest', '2nd closest', '3rd closest', '4th closest', '5th closest', '6th closest', '7th closest', '8th closest', '9th closest', '10th closest'];
let STRONG = 0.055, MODERATE = 0.02, TITLE_W = 0.5, TITLE_REF = 0.85;

/* ------------------------------------------------------------------ helpers */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const fmt = n => Number(n).toLocaleString('en-US');
const trunc = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s; };
function b64bytes(s) { const bin = atob(s); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
const u16 = s => new Uint16Array(b64bytes(s).buffer);
const u8 = s => b64bytes(s);
const f32 = s => new Float32Array(b64bytes(s).buffer);
const s16 = q => 0.5 + q / 10000;
const s8 = q => 0.5 + q / 500;
const dv = (col, r) => col.v[col.i[r]];
const ls = {
  ok: (() => { try { localStorage.setItem('eqr.t', '1'); localStorage.removeItem('eqr.t'); return true; } catch (e) { return false; } })(),
  get(k, d) { try { const v = localStorage.getItem('eqr.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('eqr.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
const icon = {
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  ext: '<svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  search: '<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>',
  note: '<svg class="i" viewBox="0 0 24 24"><path d="M5 19h4L19.5 8.5a2.1 2.1 0 0 0-3-3L6 16v3z"/></svg>',
  caret: '<svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M7 10l5 5 5-5"/></svg>',
};

/* ------------------------------------------------------------------ data */
const D = { detail: new Map(), done: new Map() };
const Q = { code: '' };
window.EQR = window.EQR || {};
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = () => resolve(); s.onerror = () => reject(new Error('could not read ' + src));
    (document.head || document.body).appendChild(s);
  });
}
const domReady = new Promise(res => { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => res(), { once: true }); else res(); });
async function inflateJSON(b64) {
  if (typeof DecompressionStream !== 'function') throw new Error('this browser cannot unpack the data; use a current Chrome, Edge, Firefox or Safari');
  const stream = new Blob([b64bytes(b64)]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}
async function getData(name) {
  await domReady;
  const packed = document.querySelector(`script[type="application/gzip"][data-name="${name}"]`);
  if (packed) return inflateJSON(packed.textContent);
  if (!LOCAL) {
    try { const r = await fetch('data/' + name + '.json'); if (r.ok) return await r.json(); } catch (e) { /* fall back to the script form */ }
  }
  if (!(name in window.EQR)) await loadScript('data/' + name + '.js');
  const v = window.EQR[name]; delete window.EQR[name];
  if (v == null) throw new Error('data/' + name + ' is empty');
  return v;
}
function progress(f, msg) { $('#loadBar').style.width = Math.round(f * 100) + '%'; if (msg) $('#loadMsg').textContent = msg; }

async function loadAll() {
  progress(.04, 'Loading programs');
  const meta = await getData('meta');
  progress(.12, 'Loading courses abroad');
  const H = await getData('host');
  progress(.6, 'Loading the U-M catalog');
  const U = await getData('um');
  progress(.85, 'Preparing');
  Object.assign(D, { meta, H, U, n: H.n, nu: U.n, progs: meta.programs, subjects: meta.subjects, queues: meta.queues || {} });
  if (meta.thresholds) { STRONG = meta.thresholds.strong; MODERATE = meta.thresholds.moderate; }
  if (meta.match_score) { TITLE_W = meta.match_score.title_weight; TITLE_REF = meta.match_score.title_ref; }
  D.m = u16(H.m); D.ms = u16(H.ms); D.mt = u16(H.mt); D.km = H.k_match;
  D.cls = u8(H.subj_p); D.clsP = u8(H.subj_pp); D.kc = H.k_class;
  D.hh = u16(H.hh); D.hhs = u8(H.hhs); D.khh = H.k_hh;
  D.rU = f32(H.rU); D.lg = u8(H.lgroup); D.rH = U.rH.map(f32);
  D.subjByCode = new Map(D.subjects.map(s => [s.code, s]));
  D.umIndex = new Map();
  U.id.forEach((id, j) => D.umIndex.set(id, j));
  U.codes.forEach((c, j) => c.split(' / ').forEach(code => { if (!D.umIndex.has(code)) D.umIndex.set(code, j); }));
  /* the same course offered in several terms is one row per term but one course to review (one key) */
  D.keyRows = new Map();
  for (let r = 0; r < D.n; r++) { const k = H.key[r], a = D.keyRows.get(k); if (a) a.push(r); else D.keyRows.set(k, [r]); }
  D.allRows = [];
  for (let r = 0; r < D.n; r++) if (D.keyRows.get(H.key[r])[0] === r) D.allRows.push(r);
}
async function loadFocus(code) {
  const F = await getData('focus/' + code);
  Object.assign(Q, { code, k: F.k, n: F.n, rows: u16(F.rows), lvl: u8(F.lvl), pct: u8(F.pct), rank: u8(F.rank), u: u16(F.u), cs: u16(F.cs), ct: u16(F.ct) });
  Q.at = new Int32Array(D.n).fill(-1);
  for (let i = 0; i < Q.n; i++) Q.at[Q.rows[i]] = i;
  Q.member = new Uint8Array(D.nu); Q.listed = new Uint8Array(D.nu);
  for (let u = 0; u < D.nu; u++) if (D.U.codes[u].split(' / ').some(c => c.split(' ')[0] === code)) { Q.listed[u] = 1; if (!D.U.admin[u]) Q.member[u] = 1; }
  Q.cands = new Map(); Q.bestCache = new Map();
}
function loadDetail(pi) {
  const p = D.progs[pi];
  if (!D.detail.has(p.id)) {
    const pr = getData('detail/' + p.id).then(j => { j.byRow = new Map(j.rows.map((r, k) => [r, k])); D.done.set(p.id, j); return j; });
    pr.catch(() => D.detail.delete(p.id));
    D.detail.set(p.id, pr);
  }
  return D.detail.get(p.id);
}
function pickDetail(j, r) {
  const k = j.byRow.get(r);
  return { desc: j.desc[k], prereq: j.prereq[k], notes: j.notes[k], course_url: j.course_url[k], syllabus_url: j.syllabus_url[k], catalog_year: j.catalog_year[k], host: j.host[k], retrieved: j.retrieved[k], kw: j.kw ? j.kw[k] : '' };
}
async function hostDetail(r) { return pickDetail(await loadDetail(D.H.prog[r]), r); }
function detailNow(r) { const j = D.done.get(D.progs[D.H.prog[r]].id); return j ? pickDetail(j, r) : null; }

/* ------------------------------------------------------------------ scoring */
/* Match score = CSLS + TITLE_W x (title cosine - TITLE_REF), CSLS = 2 cos - rU(course abroad) - rH(U-M course):
   the cosine discounted by how close each side is to everything. Every list is ordered by it. */
function parts(r, u, cos, tcos) {
  const rU = D.rU[r], rH = D.rH[D.lg[r]][u], title = TITLE_W * (tcos - TITLE_REF);
  return { cos, tcos, rU, rH, title, score: 2 * cos - rU - rH + title };
}
const mscore = (r, u, cos, tcos) => parts(r, u, cos, tcos).score;
const strengthOf = c => c >= STRONG ? 'Strong' : c >= MODERATE ? 'Moderate' : 'Weak';
function meter(c) {
  if (c == null || !isFinite(c)) return '';
  const lo = MODERATE - 2 * (STRONG - MODERATE), hi = STRONG + (STRONG - MODERATE);
  const k = Math.max(1, Math.min(5, Math.round(1 + 4 * (c - lo) / (hi - lo))));
  return `<span class="meter${c < MODERATE ? ' weak' : ''}" aria-hidden="true">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= k ? 'on' : ''}"></i>`).join('')}</span>`;
}
/* The focus subject's ten closest courses: from the subject's queue file, else the course's overall top ten. */
function candidates(r) {
  let c = Q.cands.get(r);
  if (c) return c;
  c = [];
  const i = Q.at[r];
  if (i >= 0) {
    for (let k = 0; k < Q.k; k++) {
      const u = Q.u[i * Q.k + k]; if (u === 65535) break;
      const cos = s16(Q.cs[i * Q.k + k]), tcos = s16(Q.ct[i * Q.k + k]);
      c.push({ u, cos, tcos, score: mscore(r, u, cos, tcos), rank: k + 1 });
    }
  } else {
    for (let k = 0; k < D.km; k++) {
      const u = D.m[r * D.km + k]; if (!Q.member[u]) continue;
      const cos = s16(D.ms[r * D.km + k]), tcos = s16(D.mt[r * D.km + k]);
      c.push({ u, cos, tcos, score: mscore(r, u, cos, tcos), rank: c.length + 1 });
    }
  }
  Q.cands.set(r, c);
  return c;
}
function bestScore(r) { const c = candidates(r); return c.length ? c[0].score : -9; }
function umCode(u) { const c = D.U.codes[u].split(' / ').find(x => x.split(' ')[0] === Q.code); return c || D.U.id[u]; }
function umLevel(u) { const n = parseInt(D.U.number[u], 10) || 0; return n ? Math.min(5, Math.max(1, Math.floor(n / 100))) : 0; }
const fmtCredits = c => !c ? '' : /^\d/.test(c) ? c.replace(/^(\d+(?:\.\d+)?(?:\s*-\s*\d+(?:\.\d+)?)?)/, (m) => m + (m === '1' ? ' credit' : ' credits')) : c;
function umCredit(u) { const m = /\d+(?:\.\d+)?/.exec(D.U.credits[u] || ''); return m ? m[0] : ''; }
const bandLabel = b => { if (!b) return ''; const l = x => x === 5 ? 'graduate' : x + '00'; return b[0] === b[1] ? l(b[0]) : l(b[0]) + '–' + l(b[1]); };
const shortProg = p => p.name.replace(/^University Study in (the )?/, '').replace(/, (Spain|Argentina|Denmark|Sweden|Czechia)$/, '');
const queueLevel = r => { const i = Q.at[r]; return i >= 0 ? Q.lvl[i] : -1; };

/* ------------------------------------------------------------------ decisions store */
/* shared: the page's database (one document per course and subject, visible to everyone who can open the page);
   local: this browser (opened from disk, or signed out); memory: nothing persists. */
const cap = { db: null, user: null, downloads: null, me: null, canWrite: null, readOnly: false };
const store = { kind: ls.ok ? 'local' : 'memory', map: new Map(), unsub: null, all: null };
const LS_REVIEWS = 'reviews.v1';
const names = new Map();
const docId = key => Q.code + '~' + key;
const getDoc = r => store.map.get(D.H.key[r]) || null;
function statusOf(r) { const d = getDoc(r); if (!d || !d.decision) return 'todo'; return d.decision === 'info' ? 'info' : 'done'; }

async function initShared() {
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function') return;
  const use = n => Promise.resolve(cl.use(n)).catch(() => null);
  const [db, user, downloads] = await Promise.all([use('db'), use('user'), use('downloads')]);
  cap.user = user; cap.downloads = downloads;
  if (user) {
    try { cap.me = await user.me(); } catch (e) { cap.me = null; }
    try { cap.canWrite = await user.can('data.write'); } catch (e) { cap.canWrite = null; }
  }
  if (db) { cap.db = db; store.kind = 'shared'; cap.readOnly = cap.canWrite === false; }
}
function localAll() { if (!store.all) store.all = (ls.ok && ls.get(LS_REVIEWS, {})) || {}; return store.all; }
function reloadLocalMap() {
  store.map = new Map();
  for (const doc of Object.values(localAll())) if (doc && doc.subject === Q.code && doc.key) store.map.set(doc.key, doc);
}
function subscribe() {
  if (store.unsub) { store.unsub(); store.unsub = null; }
  store.map = new Map();
  const subject = Q.code;
  if (store.kind !== 'shared') {
    reloadLocalMap();
    if (siteOn()) scheduleSync(50);
    return Promise.resolve();
  }
  return new Promise(resolve => {
    let first = true;
    const done = () => { if (first) { first = false; resolve(); } };
    setTimeout(done, 8000);
    try {
      store.unsub = cap.db.collection('reviews').where('subject', '==', subject).onSnapshot(snap => {
        if (subject !== Q.code) return;
        const m = new Map();
        snap.docs.forEach(d => { const x = d.data(); if (x && x.key) m.set(x.key, x); });
        store.map = m;
        resolveNames();
        if (first) done(); else onDecisionsChanged();
      }, err => { toast('Shared decisions are unavailable right now (' + (err && err.code) + ').'); done(); });
    } catch (e) { done(); }
  });
}
async function putDoc(key, body) {
  if (body) store.map.set(key, body); else store.map.delete(key);
  const id = docId(key);
  if (store.kind === 'shared') {
    if (body) await cap.db.doc('reviews/' + id).set(body); else await cap.db.doc('reviews/' + id).delete();
  } else {
    const all = localAll();
    if (body) all[id] = body; else delete all[id];
    if (store.kind === 'local' && !ls.set(LS_REVIEWS, all)) throw { code: 'local_storage' };
    if (siteOn()) {
      const tomb = syncState().tomb;
      if (body) delete tomb[id]; else tomb[id] = new Date().toISOString();
      saveSyncState();
      scheduleSync(COMMIT_DELAY);
    }
  }
}

/* ------------------------------------------------------------------ the website's decisions file */
/* On the website (and in the offline file built for it) decisions also live in one CSV in the site's GitHub
   repository (SITE.path, served at SITE.url), one row per course and subject. Every copy of the page reads it;
   a browser holding a GitHub token also writes it, through the GitHub contents API, with the file's sha so
   that two writers cannot overwrite each other (a stale write is refused, re-read and merged). Writes are
   batched (COMMIT_GAP) because each commit rebuilds the GitHub Pages site. Each side keeps the newer version
   of a row; a row removed from the file is removed here. A hosted artifact cannot do this: its frame blocks
   requests to other sites. */
const SITE_BUILTIN = {"repo": "hutengdai/hutengdai.github.io", "branch": "master", "path": "data/decisions.csv", "url": "https://hutengdai.com/data/decisions.csv"};
const SITE = SITE_BUILTIN;
const FILE_COLS = ['updated', 'subject', 'decision', 'um_equivalent', 'um_title', 'credits', 'disapproved', 'notes', 'reviewer', 'program', 'course_code', 'title', 'course_key'];
const OUT_BY_LABEL = { Approved: 'equivalent', 'Elective credit': 'dept', 'General credit only': 'general', 'Not approved': 'no', 'Needs information': 'info', 'In progress': '' };
const COMMIT_DELAY = 15000, COMMIT_GAP = 6 * 60000, GH_API = 'https://api.github.com';
const sync = { token: '', login: '', busy: false, again: false, last: 0, lastCommit: 0, rows: 0, pending: 0, error: '', warned: false, st: null };
const siteOn = () => !!SITE && store.kind !== 'shared';
function syncState() { if (!sync.st) sync.st = { meta: ls.get('site.meta', {}) || {}, tomb: ls.get('site.tomb', {}) || {} }; return sync.st; }
function saveSyncState() { ls.set('site.meta', sync.st.meta); ls.set('site.tomb', sync.st.tomb); }
let syncTimer = null;

/* shared terms between the two descriptions, highlighted in both */
const STOP = new Set(('introduce introduces introduced introducing fundamental fundamentals concept concepts aims students the and for with from into this that these those their there which will also such than then they them have has had are was were been being its our your can may must not but all any each more most other some only over under upon about between within across through using used use based including include includes study studies course courses module modules unit units student learn learning introduction introductory topics topic semester term week weeks lecture lectures seminar seminars class classes assessment exam essay credit credits level part year years hours work research analysis understanding knowledge skills develop development explore explores examine examines focus focuses provide provides overview approach approaches area areas issues issue main key basic advanced different various first second third range well both able ability practice practical will would should could general introduction').split(' '));

function termSet(text, surf) {
  const s = new Map();
  for (const w of norm(text).match(/[a-z]{4,}/g) || []) {
    if (STOP.has(w)) continue; const k = stem(w); if (k.length < 4) continue;
    s.set(k, (s.get(k) || 0) + 1);

  const both = [...a.keys()].filter(k => b.has(k)).sort((x, y) => (a.get(y) + b.get(y)) - (a.get(x) + b.get(x))).slice(0, 14);

}

}

      if (!other && !Q.listed[u]) continue;
      if (t.length) { const s = norm(D.U.codes[u] + ' ' + D.U.title[u]); if (!t.every(w => s.includes(w))) continue; }
      out.push(u);
    }
    out.sort((a, b) => (Q.listed[b] - Q.listed[a]) || umCode(a).localeCompare(umCode(b), 'en', { numeric: true }));
    $('#plist').innerHTML = out.slice(0, 300).map(u => `<button class="prow" data-act="pick-u" data-u="${u}"><span><span class="c">${esc(Q.listed[u] ? umCode(u) : D.U.id[u])}</span> <span class="t">${esc(D.U.title[u])}</span></span><span class="small">${esc(D.U.credits[u] || '')}</span><span class="m">${esc(D.U.codes[u].includes(' / ') ? D.U.codes[u] : dv(D.U.level, u))}${D.U.admin[u] ? ' · independent study, thesis or topics course' : ''}</span></button>`).join('') + (out.length > 300 ? `<div class="small">${fmt(out.length - 300)} more: type to narrow.</div>` : '') || '<div class="small">No U-M course matches.</div>';
  };
  $('#pq').addEventListener('input', draw);
  $('#pother').addEventListener('change', e => { other = e.target.checked; draw(); });
  draw();
  if (matchMedia('(min-width: 700px)').matches) $('#pq').focus();
}
function pickCourse(u) {
  const d = state.d; if (!d) return;
  if (!candidates(state.r).some(c => c.u === u) && !d.picked.includes(u)) d.picked.push(u);
  d.sel = { kind: 'c', u }; d.view = 'cand';
  if (!d.creditsTouched) d.credits = defaultCredits(state.r, d.sel);
  closeSheet();
  renderDecide(); rerenderSides();
}
function openDecisions() {
  const H = D.H, list = [...store.map.values()].filter(x => x.decision).sort((a, b) => String(b.updated_at).localeCompare(String(a.updated_at)));
  const pend = [...store.map.values()].filter(x => !x.decision && x.rejected && x.rejected.length).length;
  const rowOf = key => (D.keyRows.get(key) || [])[0];
  const where = store.kind === 'shared' ? 'Saved with this page, visible to everyone who can open it.' : siteOn() ? (sync.token ? 'Saved in this browser and the website file (' + syncLabel() + ').' : 'The website file is read here; decisions recorded here stay in this browser.') : store.kind === 'local' ? 'Saved in this browser only.' : 'Not saved: copy them before closing the page.';
  const body = `<div class="toolbar">
      <span class="small">${fmt(list.length)} decided${pend ? `, ${fmt(pend)} in progress` : ''} for ${esc(Q.code)}. ${esc(where)}</span><span class="grow"></span>
      ${store.kind !== 'shared' ? `<label class="small" style="display:flex;gap:6px;align-items:center">Your name <input id="myname" value="${esc(ls.get('name', ''))}" placeholder="for the CSV" style="width:12em"></label>` : ''}
      <button class="btn" data-act="copy-csv" ${list.length ? '' : 'disabled'} title="Tab-separated: pastes into Google Sheets or Excel as columns">Copy for a spreadsheet</button>
      ${cap.downloads || !window.claude ? `<button class="btn primary" data-act="download-csv" ${list.length ? '' : 'disabled'}>Download CSV</button>` : ''}
    </div>
    ${list.length ? `<div class="tablewrap"><table><thead><tr><th>Course abroad</th><th>Program</th><th>Decision</th><th>U-M equivalent</th><th>Credits</th><th>Disapproved</th><th>Note</th><th>By</th><th>When</th></tr></thead><tbody>${list.map(x => {
      const r = rowOf(x.key), o = OUT[x.decision] || { label: x.decision, cls: 'gen' };
      return `<tr class="${r != null ? 'click' : ''}" ${r != null ? `data-act="goto" data-r="${r}"` : ''}><td><div class="tt">${esc(x.title)}</div><div class="small mono">${esc(x.code || '')}</div></td><td class="small">${r != null ? esc(shortProg(D.progs[H.prog[r]])) : esc(x.program || '')}</td><td><span class="pill ${o.cls}">${esc(o.label)}</span></td><td class="mono small">${esc(x.equivalent || '')}</td><td class="num">${esc(x.credits || '')}</td><td class="small mono">${esc((x.rejected || []).join(', '))}</td><td class="small" style="max-width:280px">${esc(x.notes || '')}</td><td class="small">${esc(whoName(x))}</td><td class="small muted">${esc(timeAgo(x.updated_at))}</td></tr>`;
    }).join('')}</tbody></table></div>` : `<div class="empty"><h3>No ${esc(Q.code)} decisions yet</h3>Approve or disapprove a course and it appears here.</div>`}`;
  openSheet('Decisions for ' + Q.code, body, true);
  const nm = $('#myname'); if (nm) nm.addEventListener('change', () => ls.set('name', nm.value.trim()));
}
function decisionsCSV(tsv) {
  const H = D.H, rowOf = key => (D.keyRows.get(key) || [])[0];
  const head = ['subject', 'decision', 'um_equivalent', 'um_title', 'um_credits', 'disapproved', 'notes', 'program', 'country', 'course_code', 'title', 'host_term', 'host_level', 'host_credits', 'course_url', 'reviewer', 'updated'];
  const rows = [...store.map.values()].filter(x => x.decision).sort((a, b) => String(a.program).localeCompare(String(b.program)) || String(a.title).localeCompare(String(b.title))).map(x => {
    const r = rowOf(x.key), p = r != null ? D.progs[H.prog[r]] : null, det = r != null ? detailNow(r) : null;
    return [x.subject, (OUT[x.decision] || {}).label || x.decision, x.equivalent, x.um_title, x.credits, (x.rejected || []).join('; '), x.notes, p ? p.name : x.program, p ? p.country : '', x.code, x.title,
      r != null ? dv(H.term, r) : '', r != null ? dv(H.level, r) : '', r != null ? dv(H.credits, r) : '', det ? det.course_url : '', whoName(x) === 'you' ? (cap.me && cap.me.name) || 'you' : whoName(x), x.updated_at];
  });
  if (tsv) return [head, ...rows].map(r => r.map(v => String(v ?? '').replace(/[\t\r\n]+/g, ' ')).join('\t')).join('\n') + '\n';
  return [head, ...rows].map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n') + '\n';
}
async function downloadCSV() {
  await Promise.all([...new Set([...store.map.values()].map(x => (D.keyRows.get(x.key) || [])[0]).filter(r => r != null).map(r => D.H.prog[r]))].map(pi => loadDetail(pi).catch(() => null)));
  const name = `decisions-${Q.code}-${new Date().toISOString().slice(0, 10)}.csv`, data = decisionsCSV();
  if (cap.downloads) {
    try { await cap.downloads.save({ filename: name, data }); } catch (e) { if (e && e.code !== 'declined') toast('Download failed (' + ((e && e.code) || 'error') + '). Use Copy for a spreadsheet instead.'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + data], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function copyCSV() {
  const data = decisionsCSV(true);
  try { await navigator.clipboard.writeText(data); toast('Copied. Paste into the first cell of a sheet: it fills the columns.'); }
  catch (e) {
    $('#sbody').insertAdjacentHTML('beforeend', `<textarea style="width:100%;height:160px;margin-top:12px;font:12px var(--mono)" readonly id="csvTa">${esc(data)}</textarea>`);
    const ta = $('#csvTa'); ta.focus(); ta.select(); toast('Select all and copy.');
  }
}

/* ------------------------------------------------------------------ toast */
let toastTimer;
function toast(msg, withUndo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${withUndo && lastAction ? '<button data-act="undo">Undo</button>' : ''}`;
  t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, withUndo ? 7000 : 3800);
}
function hideToast() { $('#toast').hidden = true; }

/* ------------------------------------------------------------------ events */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!$('#menu').hidden && !e.target.closest('#menu') && !(el && el.dataset.act === 'menu')) closeMenu();
  if (!el) return;
  const act = el.dataset.act, d = state.d;
  switch (act) {
    case 'prev': step(-1); break;
    case 'next': step(1); break;
    case 'approve': await approve(); break;
    case 'disapprove': await disapprove(); break;
    case 'out': await outcome(el.dataset.k); break;
    case 'elective': if (d) { d.sel = { kind: 'e', lvl: electiveDefault(state.r, d.sel) }; d.view = 'cand'; if (!d.creditsTouched) d.credits = defaultCredits(state.r, d.sel); renderDecide(); renderUM(); const b = $('.approve'); if (b) b.focus(); } break;
    case 'top': if (d) { d.view = d.view === 'top' ? 'cand' : 'top'; renderDecide(); renderUM(); if (d.view === 'top' && matchMedia('(max-width: 860px)').matches) $('#um').scrollIntoView({ behavior: 'smooth', block: 'start' }); } break;
    case 'pick-cand': if (d) { pickCourse(+el.dataset.u); } break;
    case 'pick': openPicker(); break;
    case 'pick-u': pickCourse(+el.dataset.u); break;
    case 'note': if (d) { d.noteOpen = !d.noteOpen; renderDecide(); if (d.noteOpen) $('#noteTa').focus(); } break;
    case 'change': if (d) { d.changing = true; renderDecide(); } break;
    case 'cancel-change': openCourse(state.r, { keepScroll: true }); break;
    case 'next-todo': { const i = state.queue.indexOf(state.r); const nx = firstTodo(i >= 0 ? i + 1 : state.lastPos); if (nx >= 0) openCourse(nx); else toast('Every course in this list has a decision.'); break; }
    case 'goto': { const r = +el.dataset.r; closeList(); closeSheet(); openCourse(r); break; }
    case 'expand': { const t = document.getElementById(el.dataset.t); t.classList.toggle('clamp'); el.textContent = t.classList.contains('clamp') ? 'Show all' : 'Show less'; break; }
    case 'list': openList(); break;
    case 'close-drawer': closeList(); break;
    case 'seg': {
      const g = el.dataset.g, v = el.dataset.v;
      state[g] = v; if (g !== 'status') ls.set(g, v);
      refreshQueue(); drawList(false, true);
      if (state.queue.indexOf(state.r) < 0 && state.queue.length) { const nx = firstTodo(0); openCourse(nx >= 0 ? nx : state.queue[0]); }
      break;
    }
    case 'reset-list': { state.q = ''; state.status = 'all'; state.scope = 'likely'; ls.set('scope', 'likely'); state.prog = -1; ls.set('prog.' + Q.code, ''); const inp = $('#lq'); if (inp) inp.value = ''; refreshQueue(); drawList(false, true); break; }
    case 'menu': $('#menu').hidden ? openMenu() : closeMenu(); break;
    case 'subject': openSubjects(); break;
    case 'set-subject': await setSubject(el.dataset.c); break;
    case 'decisions': openDecisions(); break;
    case 'about': openAbout(); break;
    case 'close-sheet': closeSheet(); break;
    case 'download-csv': await downloadCSV(); break;
    case 'copy-csv': await copyCSV(); break;
    case 'sitefile': openSiteFile(); break;
    case 'site-token': await siteToken(); break;
    case 'site-forget': siteForget(); break;
    case 'site-save-now': await syncSite(true); renderSyncStatus(); if (!sync.error && !sync.pending) toast('Saved to the decisions file.'); break;
    case 'undo': hideToast(); await undo(); break;
    case 'clear': await clearDecision(); break;
  }
});
document.addEventListener('toggle', e => {
  const t = e.target;
  if (t.matches && t.matches('details[data-sect="similar"]') && t.open) { const b = $('#simBody'); if (b && state.r >= 0) b.innerHTML = similarHTML(state.r); }
}, true);
document.addEventListener('keydown', async e => {
  if (e.key === 'Escape') { if (!$('#menu').hidden) closeMenu(); else if (!$('#sheet').hidden) closeSheet(); else if (!$('#drawer').hidden) closeList(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.metaKey || e.ctrlKey || e.altKey) return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.lrow')) { e.preventDefault(); e.target.click(); return; }
  if (!$('#sheet').hidden || !$('#drawer').hidden || state.r < 0 && !['l', 'L'].includes(e.key)) return;
  const k = e.key.toLowerCase();
  if (e.key === 'ArrowRight' || k === 'j') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft' || k === 'k') { e.preventDefault(); step(-1); }
  else if (k === 'a') { const doc = getDoc(state.r); if (!(doc && doc.decision && !state.d.changing)) await approve(); }
  else if (k === 'd' || k === 'x') { const doc = getDoc(state.r); if (!(doc && doc.decision && !state.d.changing)) await disapprove(); }
  else if (k === 't' && state.d) { state.d.view = state.d.view === 'top' ? 'cand' : 'top'; renderDecide(); renderUM(); }
  else if (k === 'l') { e.preventDefault(); openList(); }
});
$('#progSel').addEventListener('change', e => setProg(+e.target.value));
new ResizeObserver(() => { document.documentElement.style.setProperty('--top-h', $('#top').offsetHeight + 'px'); }).observe($('#top'));
addEventListener('resize', () => { fitClamp(); closeMenu(); });

/* ------------------------------------------------------------------ boot */
function startPosition() {
  const key = ls.get('cur.' + Q.code, '');
  const saved = key ? state.queue.find(r => D.H.key[r] === key) : undefined;
  if (saved != null) { openCourse(saved); return; }
  const nx = firstTodo(0);
  openCourse(nx >= 0 ? nx : (state.queue[0] ?? -1));
}
function loadError(e) {
  const packed = !!document.querySelector('script[type="application/gzip"]');
  $('#loadMsg').innerHTML = `The course data could not be loaded (${esc(e && e.message || e)}).` + (LOCAL && !packed ? '<br>This copy has no data inside it. Open equivalency-review.html, the single-file version.' : '');
  $('#loadBar').parentElement.hidden = true;
}
async function boot() {
  const shared = initShared().catch(() => {});
  try { await loadAll(); } catch (e) { loadError(e); return; }
  if (!D.queues[state.focus]) state.focus = D.queues.LING ? 'LING' : Object.keys(D.queues)[0];
  try { progress(.9, 'Loading the ' + state.focus + ' list'); await loadFocus(state.focus); } catch (e) { loadError(e); return; }
  if (window.claude) progress(.95, 'Loading decisions');
  await shared;
  if (SITE) { sync.token = ls.get('site.token', '') || ''; sync.login = ls.get('site.login', '') || ''; sync.lastCommit = +ls.get('site.lastCommit', 0) || 0; }
  await subscribe();
  const pid = ls.get('prog.' + Q.code, '');
  state.prog = pid ? D.progs.findIndex(p => p.id === pid) : -1;
  if (!['likely', 'possible', 'all'].includes(state.scope)) state.scope = 'likely';
  if (!['prog', 'best'].includes(state.sort)) state.sort = 'prog';
  buildQueue();
  $('#loading').hidden = true;
  ['decideWrap', 'pair', 'subjBtn', 'nav', 'progSel', 'listBtn', 'menuBtn'].forEach(id => { $('#' + id).hidden = false; });
  document.documentElement.style.setProperty('--top-h', $('#top').offsetHeight + 'px');
  startPosition();
  if (location.hash === '#about') openAbout();
}
boot();
</script>
